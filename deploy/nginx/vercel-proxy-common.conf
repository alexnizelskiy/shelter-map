# Общие директивы прокси на Vercel (include из server-блоков доменов). __PROXY_SECRET__ подставляет скрипт установки.
proxy_pass https://vercel_up;
proxy_http_version 1.1;
proxy_set_header Connection "";

# Имя проекта на Vercel берётся из $up_host (оно задано в server-блоке домена)
proxy_ssl_server_name on;
proxy_ssl_name $up_host;
proxy_set_header Host $up_host;

# Настоящий IP посетителя: Vercel перезаписывает X-Forwarded-For, поэтому дублируем его в свой заголовок с секретом
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Opora-Client-IP $remote_addr;
proxy_set_header X-Opora-Proxy-Secret "__PROXY_SECRET__";

# Как у основного сайта: короткий таймаут подключения и повторы на другой адрес Vercel при обрыве
proxy_connect_timeout 2s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
proxy_buffering on;
proxy_buffers 32 64k;
proxy_busy_buffers_size 256k;
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
