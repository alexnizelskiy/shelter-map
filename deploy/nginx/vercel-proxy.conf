# Обратный прокси на Vercel для домена __DOMAIN__.
# Устанавливается скриптом deploy/setup-vercel-proxy.sh; __DOMAIN__ и __PROXY_SECRET__ подставляет скрипт.
# HTTPS (сертификат Let's Encrypt, редирект с http) добавляет certbot командой из docs/proxy.md.

# Адрес Vercel определяется по имени, а не по IP: так прокси не зависит от смены адресов Vercel
# и не зацикливается, когда __DOMAIN__ указывает на этот сервер.

# WWW-BEGIN
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
# WWW-END

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 5m;          # фото до ~900 КБ, запас на остальное

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $vercel_upstream cname.vercel-dns.com;
        proxy_pass https://$vercel_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Vercel выбирает проект по имени хоста и SNI: домен __DOMAIN__ должен быть добавлен в нужный проект на Vercel
        proxy_ssl_server_name on;
        proxy_ssl_name __DOMAIN__;
        proxy_set_header Host __DOMAIN__;

        # Настоящий IP посетителя: Vercel перезаписывает X-Forwarded-For, поэтому дублируем в свой заголовок с секретом
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Opora-Client-IP $remote_addr;
        proxy_set_header X-Opora-Proxy-Secret "__PROXY_SECRET__";

        # Next.js отдаёт страницы потоком, поэтому буферизацию выключаем
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;      # маршруты и поиск могут отвечать дольше 10 секунд
    }
}
