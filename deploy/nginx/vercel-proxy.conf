# Обратный прокси на Vercel для домена __DOMAIN__.
# Устанавливается скриптом deploy/setup-vercel-proxy.sh; __DOMAIN__ и __SERVER_NAMES__ подставляет скрипт.
# Общие настройки (upstream vercel_up, зона кэша cache_zone, заголовки) — те же, что у основного сайта на этом сервере.
# HTTPS (сертификат Let's Encrypt и редирект с http) добавляет certbot командой из docs/proxy.md.
#
# Редиректов между www и корневым доменом здесь нет: оба имени уходят на Vercel с тем именем, под которым пришёл посетитель,
# а какой адрес главный, решает Vercel (Settings → Domains). Так петли редиректов невозможны.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    client_max_body_size 25m;
    set $up_host $host;   # Vercel выбирает проект по имени хоста (Host и SNI): оба имени должны быть добавлены в проект на Vercel

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    # Статика Next.js (имена файлов с хэшем): долгий кэш на сервере, сеть до Vercel бывает нестабильной
    location ^~ /_next/static/ {
        include snippets/vercel-proxy-common.conf;
        proxy_cache cache_zone;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Set-Cookie;
        add_header X-Proxy-Cache $upstream_cache_status;
    }

    # Всё остальное — без кэша (страницы, API, чат, маршруты)
    location / {
        include snippets/vercel-proxy-common.conf;
    }
}
